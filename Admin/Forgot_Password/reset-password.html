<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Procurement System</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="reset-password.css" />
  </head>
  <body>
    <div class="reset-page">
      <div class="reset-card">
        <div class="reset-header">
          <i class="fas fa-key icon"></i>
          <h1>Reset Password</h1>
          <p>Enter your new password below</p>
        </div>

        <!-- Message area (success / error) -->
        <div id="messageBox" class="message-box" style="display: none"></div>

        <!-- Loading state -->
        <div id="loadingState" class="loading-state">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Verifying reset link...</p>
        </div>

        <!-- Reset form -->
        <form id="resetPasswordForm" class="reset-form" style="display: none">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              placeholder="Enter new password"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <!-- Strength message will be added here by JS -->
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm new password"
              required
              autocomplete="new-password"
            />
          </div>

          <button type="submit" class="btn-reset" id="submitBtn">
            <span id="btnText">Reset Password</span>
            <span id="btnLoader" style="display: none">
              <i class="fas fa-spinner fa-spin"></i> Resetting...
            </span>
          </button>
        </form>

        <div class="reset-footer">
          <a href="../HTML/ZE-Electronics.php" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Login
          </a>
        </div>
      </div>
    </div>

    <script src="reset-password.js"></script>
  </body>
</html>
